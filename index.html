<!DOCTYPE html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Anatomical Theatre · University of Virginia</title>
<meta name="description" content="Thomas Jefferson's Anatomical Theatre, 1826–1939, reconstructed from the Historic American Buildings Survey.">

<style>
  :root{
    --ink:#101820;
    --line:#2c3b49;
    --bone:#e8e3d6;
    --bone-dim:#9aa6ad;
    --oxblood:#b4453a;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;overflow:hidden;background:var(--ink);color:var(--bone);
    font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
  .track{letter-spacing:.34em;text-transform:uppercase}

  #three{position:fixed;inset:0;width:100%;height:100%;z-index:1;display:block}
  /* kept in the page purely to launch AR; never seen */
  model-viewer{position:fixed;inset:0;width:100%;height:100%;z-index:0;
    opacity:0;pointer-events:none;--poster-color:transparent}

  /* sheet border, after the HABS drawing frame */
  #frame{position:fixed;inset:14px;border:1px solid var(--line);pointer-events:none;z-index:5}
  @media (max-width:700px){#frame{inset:8px}}

  #panel{position:fixed;left:15px;top:15px;z-index:6;pointer-events:none}
  #panel h1{font-size:11px;font-weight:600;margin:0 0 3px}
  #panel .lede{font-size:9px;color:var(--bone-dim);letter-spacing:.2em;margin:0}

  footer{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;justify-content:center;
    gap:6px;flex-wrap:wrap;padding:20px 16px calc(58px + env(safe-area-inset-bottom,0px))}
  button{font:inherit;font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--bone-dim);background:rgba(16,24,32,.72);border:1px solid var(--line);
    padding:11px 15px;cursor:pointer;transition:.15s;backdrop-filter:blur(6px)}
  button:hover{color:var(--bone);border-color:#44586a}
  button[aria-pressed="true"]{color:var(--ink);background:var(--bone);border-color:var(--bone)}
  #ar{color:var(--bone);border-color:var(--oxblood);box-shadow:inset 2px 0 0 var(--oxblood)}
  button:focus-visible{outline:2px solid var(--oxblood);outline-offset:2px}

  #readout{position:fixed;right:15px;top:15px;z-index:6;font-size:9px;letter-spacing:.2em;
    color:var(--bone-dim);text-align:right;pointer-events:none;max-width:46%;line-height:1.9}

  #titleblock{position:fixed;right:15px;bottom:15px;z-index:6;
    border-left:1px solid var(--line);border-top:1px solid var(--line);
    background:rgba(16,24,32,.82);backdrop-filter:blur(6px);
    padding:9px 15px 10px;text-align:right;pointer-events:none}
  #titleblock .name{font-size:12px;font-weight:600}
  #titleblock .sub{font-size:8px;color:var(--bone-dim);margin-top:5px;letter-spacing:.2em}

  #hint{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;z-index:6;
    font-size:8.5px;letter-spacing:.24em;color:#66757f;pointer-events:none;text-align:center;
    transition:opacity .6s;padding:0 20px}

  @media (max-width:760px){
    #titleblock{left:15px;right:15px;text-align:left;border-right:0}
    #readout{display:none}
    footer{padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
    #hint{bottom:132px}
  }
  /* ?ar=1 — one button, nothing else */
  body.ar-only #bOut, body.ar-only #bHill, body.ar-only #bIn,
  body.ar-only #readout, body.ar-only #titleblock{display:none}
  body.ar-only #ar, body.ar-only #arSmall{font-size:11px;padding:16px 22px}
  body.ar-only #hint{opacity:1!important;bottom:104px;max-width:320px;left:50%}

  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<model-viewer id="mv"
  src="theatre.glb?v=11"
  ios-src="theatre.usdz?v=11"
  alt="Thomas Jefferson's Anatomical Theatre, a 44-foot square brick building of two storeys with half-round windows and a railed parapet."
  ar ar-modes="scene-viewer webxr quick-look" ar-scale="auto" ar-placement="floor"
  camera-controls touch-action="pan-y" interaction-prompt="none"
  shadow-intensity="0" exposure="1.0" environment-image="neutral" tone-mapping="commerce"
  camera-orbit="38deg 76deg 46m" camera-target="0m 4.2m 0m"
  min-camera-orbit="auto 8deg 5m" max-camera-orbit="auto 91deg 110m"
  min-field-of-view="18deg" max-field-of-view="55deg">
</model-viewer>

<div id="frame"></div>

<div id="panel">
  <h1 class="track">Anatomical Theatre</h1>
  <p class="lede track">Model from HABS sheets 1–7</p>
</div>

<div id="readout" class="track">
  Reconstructed from the survey<br>measured drawings · other<br>
  reconstructions, based on<br>photographs, differ
</div>

<div id="hint" class="track">Drag to orbit · pinch to zoom</div>

<footer>
  <button id="bOut" class="track" aria-pressed="true">Exterior</button>
  <button id="bHill" class="track" aria-pressed="false">On its hill</button>
  <button id="bIn" class="track" aria-pressed="false">Look inside</button>
  <button id="ar" class="track" hidden>Actual size</button>
  <button id="arSmall" class="track" hidden>Tabletop</button>
</footer>

<div id="titleblock">
  <div class="name track">Anatomical Theatre</div>
  <div class="sub track">Historic American Buildings Survey · 7 sheets</div>
</div>

<canvas id="three"></canvas>

<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>

<script type="module"
  src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.3.1/model-viewer.min.js"></script>

<script type="module">
  const mv = document.getElementById('mv');
  const hint = document.getElementById('hint');
  const arBtn = document.getElementById('ar');
  const arSmallBtn = document.getElementById('arSmall');
  const btn = { out:document.getElementById('bOut'),
                hill:document.getElementById('bHill'),
                in:document.getElementById('bIn') };

  const HINT = {
    out:  'Drawn from the survey sheets · 44 feet square',
    hill: 'The ground fell about 11 feet to the rear · the charnel door sits at the low side',
    in:   'Theatre above · museum below · the charnel occupying the basement'
  };

  // ?ar=1 lands on a stripped page with one button.  Neither platform will
  // enter AR without a tap, so this cannot auto-launch -- it just removes
  // everything else so the only thing to do is start it.
  const arOnly = new URLSearchParams(location.search).has('ar');

  const V = 11;                    // bump with the models to bust caches
  let mode = 'out';
  const viewer = (await import('./viewer.js')).start(document.getElementById('three'));
  viewer.setActive(true);
  viewer.show('out');

  function show(next){
    mode = next;
    viewer.show(mode);
    for (const k in btn) btn[k].setAttribute('aria-pressed', String(k === mode));
    const canAR = mode === 'out' && mv.canActivateAR;
    arBtn.hidden = !canAR;
    arSmallBtn.hidden = !canAR;
    hint.textContent = HINT[mode];
    hint.style.opacity = 1;
    clearTimeout(show._t);
    show._t = setTimeout(() => { hint.style.opacity = 0; }, 6000);
  }

  for (const k in btn) btn[k].addEventListener('click', () => show(k));

  if (arOnly){
    document.body.classList.add('ar-only');
    hint.textContent = 'Tabletop places an 11-inch model you can walk around. Actual size is 44 feet — aim well away from your feet before tapping. Pinch to resize either.';
    hint.style.opacity = 1;
    clearTimeout(show._t);
  }

  // AR is the flat model only; model-viewer hands it to Quick Look or Scene Viewer.
  // Two entry points: the building at true size, and a tabletop copy at
  // 1/4" = 1'-0" for when you want to walk around it rather than stand in it.
  function launchAR(base){
    if (mv.getAttribute('src').startsWith(base)) return mv.activateAR();
    mv.addEventListener('load', () => mv.activateAR(), { once: true });
    mv.setAttribute('src', base + '.glb?v=' + V);
    mv.setAttribute('ios-src', base + '.usdz?v=' + V);
  }
  arBtn.addEventListener('click', () => launchAR('theatre'));
  arSmallBtn.addEventListener('click', () => launchAR('theatre_model'));

  mv.addEventListener('load', () => {
    const canAR = mode === 'out' && mv.canActivateAR;
    arBtn.hidden = !canAR;
    arSmallBtn.hidden = !canAR;
  });

  setTimeout(() => { hint.style.opacity = 0; }, 6000);
</script>
</html>
